name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to publish (e.g. v1.0.0)'
        required: true
        type: string

permissions:
  contents: write

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  CONFIGURATION: Release
  TFMPATH: ${{ github.workspace }}/SpkDisplayController/SpkDisplayController.csproj

jobs:
  release:
    name: Publish release
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore "$env:TFMPATH"

      - name: Publish single-file
        run: >
          dotnet publish "$env:TFMPATH"
          -c $env:CONFIGURATION
          -r win-x64
          --self-contained false
          -p:PublishSingleFile=true
          --no-restore
          -o dist

      - name: Package
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'
          if ('${{ github.event_name }}' -eq 'workflow_dispatch') {
            $version = '${{ inputs.tag }}'
          }
          "packaging $version"

          $staging = 'package/SpkDisplayController'
          New-Item -ItemType Directory -Force -Path $staging | Out-Null
          Copy-Item 'dist/SpkDisplayController.exe' $staging
          Copy-Item 'README.md' $staging
          Copy-Item 'README.zh-CN.md' $staging
          Copy-Item 'LICENSE' $staging
          Compress-Archive -Path "$staging/*" -DestinationPath "SpkDisplayController-$version-win-x64.zip" -Force

          Get-ChildItem dist, . -Filter 'SpkDisplayController-*.zip' | Select-Object Name, Length

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist/SpkDisplayController.exe
            SpkDisplayController-*-win-x64.zip
